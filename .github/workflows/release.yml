name: Build and publish installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    # Pinned, not windows-latest: that image picked up a newer Visual Studio (version "18") that
    # this node-gyp doesn't recognize yet ("unknown version 'undefined'"), needed to compile the
    # process-loopback native addon. windows-2022 ships VS2022 ("17"), which node-gyp's version
    # detection actually knows about. Revisit if/when node-gyp adds support for the newer VS.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write client .env
        working-directory: packages/client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          @"
          VITE_SIGNALING_URL=wss://signaling.undersoft.tec.br
          VITE_TEST_MODE=false
          GOOGLE_OAUTH_CLIENT_ID=$env:GOOGLE_OAUTH_CLIENT_ID
          GOOGLE_OAUTH_CLIENT_SECRET=$env:GOOGLE_OAUTH_CLIENT_SECRET
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Build renderer + electron
        run: npm run build --workspace=@concord/client

      - name: Build native process-loopback addon
        run: npm run build:native --workspace=@concord/client

      - name: Package installer (Windows/NSIS)
        working-directory: packages/client
        run: npx electron-builder --config.artifactName=Concord-Setup.exe

      - name: Publish to landing page (rolling "latest" release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CONCORDPROJECT_RELEASE_TOKEN }}
        run: |
          gh release delete latest --repo mozargsj/concordProject --yes --cleanup-tag || true
          gh release create latest release/Concord-Setup.exe \
            --repo mozargsj/concordProject \
            --title "Concord — instalador mais recente" \
            --notes "Publicado automaticamente a partir de ${{ github.ref_name }} (commit ${{ github.sha }})."

      # [2026-08-29] electron-builder always writes latest.yml/*.blockmap locally alongside the
      # installer once a `publish` config exists (electron-builder.yml), regardless of whether an
      # actual upload happens — these are electron-updater's update-check metadata, distinct from
      # the landing-page installer published above (existing installs, not new downloads). Never
      # actually uploaded anywhere automatically before now (decisions.md — "no publish automation
      # yet"); this just preserves them as a workflow artifact so they can be pushed to
      # GET /updates/* (now R2-backed, packages/signaling-worker) — still a manual step until R2
      # credentials are wired into this workflow too.
      - name: Upload auto-update artifacts (latest.yml, blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: update-artifacts
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          retention-days: 14
