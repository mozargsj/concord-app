name: Build installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    # Pinned, not windows-latest: that image picked up a newer Visual Studio (version "18") that
    # this node-gyp doesn't recognize yet ("unknown version 'undefined'"), needed to compile the
    # process-loopback native addon. windows-2022 ships VS2022 ("17"), which node-gyp's version
    # detection actually knows about. Revisit if/when node-gyp adds support for the newer VS.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write client .env
        working-directory: packages/client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          @"
          VITE_SIGNALING_URL=wss://signaling.undersoft.tec.br
          VITE_TEST_MODE=false
          GOOGLE_OAUTH_CLIENT_ID=$env:GOOGLE_OAUTH_CLIENT_ID
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Build renderer + electron
        run: npm run build --workspace=@concord/client

      - name: Build native process-loopback addon
        run: npm run build:native --workspace=@concord/client

      - name: Package installer (Windows/NSIS)
        working-directory: packages/client
        run: npx electron-builder --config.artifactName=Concord-Setup.exe

      # [2026-08-30, pedido do Mozar] Publicar na landing page deixou de ser automático aqui —
      # rodava sem ordem explícita separada toda vez que a tag saía, misturado com o build no
      # mesmo job. Virou um comando manual e independente (packages/client/scripts/
      # publish-landing-page.sh), espelhando o publish-update.sh do auto-update — este job agora
      # só builda e deixa o instalador pronto como artefato de CI, sem publicar em canal nenhum
      # sozinho. Ver decisions.md.

      # [2026-08-29] electron-builder always writes latest.yml/*.blockmap locally alongside the
      # installer once a `publish` config exists (electron-builder.yml), regardless of whether an
      # actual upload happens — these are electron-updater's update-check metadata. This CI
      # artifact (`update-artifacts`) is the one shared source both publish scripts consume:
      # packages/signaling-worker/scripts/publish-update.sh (auto-update channel, R2) and
      # packages/client/scripts/publish-landing-page.sh (landing page, concordProject) — each run
      # independently, by hand, whenever that specific channel should actually be touched.
      - name: Upload auto-update artifacts (latest.yml, blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: update-artifacts
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          retention-days: 14
