# Test builds (npm run package:test-dev / package:test-offline) override productName/appId to
# "ConcordTest"/com.concord.app.test via electron-builder's --config.<path>=<value> CLI flag —
# keeps a test install from colliding with a real one on the same machine (separate install
# dir, Start Menu shortcut, and uninstall registry entry, since NSIS derives those from appId).
appId: com.concord.app
productName: Concord
electronVersion: 31.7.7
directories:
  output: ../../release
files:
  - out/electron/**/*
  - out/renderer/**/*
  - package.json
  # Native addon (packages/client/native/process-loopback) — excludes Concord's own audio from
  # the loopback captured for screen-share system audio, see processLoopbackAudio.ts. Windows
  # x64 only; missing on any other platform/arch, which the loader already treats as "native
  # path unavailable" and falls back to the plain getUserMedia capture.
  - native/process-loopback/build/Release/*.node
asarUnpack:
  # Native modules can't be dlopen'd from inside app.asar — Electron transparently redirects
  # any read of this path to the matching file under app.asar.unpacked instead.
  - native/process-loopback/build/Release/*.node
# Packaged main process reads GOOGLE_OAUTH_CLIENT_ID/SECRET from a .env sitting next to the
# installed .exe (main/index.ts) — process.cwd()-based dotenv resolution silently found nothing
# there, since cwd is wherever the user launched the .exe from, never the install directory.
# Copies whatever packages/client/.env already has at build time (same file dev mode already
# requires for Google login to work locally).
extraFiles:
  - from: .env
    to: .env
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Reuses the signaling server's own domain (already trusted, already TLS via Cloudflare) as a
# static file host for update artifacts, instead of standing up a new public S3 bucket —
# concord-server-icons is deliberately fully private (server icons/avatars), not meant to also
# serve public release files. Server side: GET /updates/* in packages/server/src/http/router.ts.
publish:
  provider: generic
  url: https://signaling.undersoft.tec.br/updates/
